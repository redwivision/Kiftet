<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0B0D" />
    <title>You are offline — Kiftet</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        min-height: 90vh;
        display: grid;
        place-content: center;
        margin: 0;
        padding: 1.5rem;
        background-color: #08090b;
        background-image: radial-gradient(
            1100px 560px at 50% -130px,
            rgba(242, 239, 233, 0.05),
            transparent 60%
          ),
          linear-gradient(180deg, #0b0c0e 0%, #0a0b0d 55%, #050506 100%);
      }
      main {
        max-width: 26rem;
        text-align: center;
        color: #f2efe9;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        color: #8b8f98;
        font-size: 0.9rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        background: #f2efe9;
        color: #0a0b0d;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
      a:hover {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <!-- The Kiftet open ring: a whole that isn't whole, with the 72° gap. -->
        <path
          d="M 93.46 43.12 A 44 44 0 1 1 56.88 6.54"
          stroke="#F2EFE9"
          stroke-width="8"
          stroke-linecap="round"
        />
      </svg>
      <h1>You are offline</h1>
      <p>
        The study room needs a connection — the diagnosis runs on the network.
        Get back online, then try again. Nothing you studied is lost.
      </p>
      <a href="/" id="retry">Try again</a>
    </main>
    <script>
      const retry = document.getElementById("retry");
      window.addEventListener("online", () => {
        location.reload();
      });
    </script>
  </body>
</html>
