<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The Kiftet brand: a circle with a segment missing — the gap (ክፍተት).
       Same geometry as the BrandMark component (from brand-mark.tsx) and the
       copy in apps/web/public/logo-mark.svg, so the README, DOCS, favicon,
       PWA icons, and on-screen mark can never drift apart.
       True-black tile so the ivory open ring reads on any surface. -->
  <circle cx="60" cy="60" r="60" fill="#0A0B0D"/>
  <path d="M 93.46 43.12 A 44 44 0 1 1 56.88 6.54"
        transform="translate(10 10)"
        stroke="#F2EFE9"
        stroke-width="10"
        stroke-linecap="round"/>
</svg>