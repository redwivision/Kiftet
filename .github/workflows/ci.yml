name: CI

# One workflow, four gates, no matrix. `main` is production, so this runs on
# every push to it and on every PR that targets it. Branch protection requires
# this check to pass before a PR can merge — see RUNBOOK §4.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Node is pinned by .nvmrc. react-router's typegen refuses to run below
      # 22.22.0, and it runs as part of check-types.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `--frozen-lockfile` fails if bun.lock and package.json disagree, so a
      # forgotten lockfile bump can't reach main. postinstall generates the
      # varlock env types from .env.schema placeholders — no secrets needed.
      - name: Install
        run: bun install --frozen-lockfile

      # biome reports and exits non-zero. It never writes here, so CI can't
      # pass on a dirty tree.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      # Cheaper than a build. The tests guard the things we actually got wrong
      # by hand: a per-concept level disappearing from the diagnosis, a
      # headline number that stops matching the stored weighted score, a study
      # order that ignores mastery, and a source anchor that points at a
      # mid-sentence fragment. The preload gives the suite an inert env, so no
      # test can inherit a real Gemini credential or dial a real database.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
